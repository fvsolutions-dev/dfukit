[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.5", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "dfukit"
# From the git tag: v2.0.1 is version 2.0.1, and builds between tags get a dev version
dynamic = ["version"]
description = "Firmware updates over any link: a CLI and a Python package over the dfukit client"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"

[project.scripts]
dfukit = "dfukit.cli:main"

[project.optional-dependencies]
serial = ["pyserial>=3.5", "burst-link-protocol>=1.1.6"]

[project.urls]
Repository = "https://github.com/fvsolutions-dev/dfukit"
Changelog = "https://github.com/fvsolutions-dev/dfukit/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest",
    "nanobind>=2.5",
    "pytest-cov>=7.1.0",
    "gcovr",
    "pyserial>=3.5",
    "burst-link-protocol>=1.1.6",
]

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
wheel.packages = ["src/python/dfukit"]
wheel.py-api = "cp312"
cmake.build-type = "Release"

[tool.cibuildwheel]
build-verbosity = 1
# Not free-threaded: the module is not written for it, and would turn the GIL back on
skip = "cp3??t-*"
# Each wheel tested as it was built, on its own Python
test-requires = "pytest"
test-command = "pytest {project}/tests"

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.14"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
isort.known-first-party = ["dfukit"]

[tool.mypy]
strict = true
mypy_path = "src/python"

[[tool.mypy.overrides]]
# No type information
module = ["serial.*", "burst_interface_c.*", "_dfukit"]
ignore_missing_imports = true
